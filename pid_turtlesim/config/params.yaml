turtle_controller:
  ros__parameters:
    # controller gains (in terms of linear distance first)
    kp_dist_parm: 7.0
    ki_dist_parm: 6.0
    kd_dist_parm: 5.0
    # controller gains (now in terms of angle/heading)
    kp_ang_parm: 20.0
    ki_ang_parm: 49.0
    kd_ang_parm: 20.0
    # parameters for determining when the robot has hit its goal
    eps_dist_tol: 0.1
    eps_ang_tol: 0.08
goto_pose_client:
  ros__parameters:
    # (x,y) goal positions
    x_goal_value: 2.
    y_goal_value: 2.
